name: Update Profile Analytics SVG

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  generate-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch Live Stats and Generate SVG
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          node -e '
          const https = require("https");
          const fs = require("fs");

          const query = `
            query {
              viewer {
                followers { totalCount }
                following { totalCount }
                repositories(first: 100, ownerAffiliations: OWNER, isFork: false) {
                  totalCount
                  nodes {
                    stargazerCount
                    languages(first: 10, orderBy: {field: SIZE, direction: DESC}) {
                      edges {
                        size
                        node { name color }
                      }
                    }
                  }
                }
                contributionsCollection {
                  contributionCalendar {
                    totalContributions
                    weeks {
                      contributionDays {
                        contributionCount
                        date
                      }
                    }
                  }
                }
              }
              search(query: "author:@me type:issue", type: ISSUE, first: 1) {
                issueCount
              }
            }
          `;

          const data = JSON.stringify({ query });

          const reqOptions = {
            hostname: "api.github.com",
            path: "/graphql",
            method: "POST",
            headers: {
              "Authorization": "bearer " + process.env.GH_PAT,
              "User-Agent": "Node.js GraphQL Client",
              "Content-Type": "application/json",
              "Content-Length": Buffer.byteLength(data)
            }
          };

          const req = https.request(reqOptions, (res) => {
            let body = "";
            res.on("data", chunk => body += chunk);
            res.on("end", () => {
              if (res.statusCode !== 200) {
                console.error("API Request Failed with status code " + res.statusCode, body);
                process.exit(1);
              }

              try {
                const response = JSON.parse(body);
                if (response.errors) {
                  console.error("GraphQL Errors:", response.errors);
                  process.exit(1);
                }

                if (!response.data || !response.data.viewer) {
                  console.error("Invalid response payload:", body);
                  process.exit(1);
                }

                const viewer = response.data.viewer;
                const search = response.data.search || { issueCount: 0 };
                const calendar = viewer.contributionsCollection.contributionCalendar;

                const totalCommits = calendar.totalContributions;
                const totalRepos   = viewer.repositories.totalCount;
                const followers    = viewer.followers.totalCount;
                const following    = viewer.following.totalCount;
                const totalIssues  = search.issueCount;

                // --- REAL stars + languages aggregation ---
                let totalStars = 0;
                const langTotals = {};
                (viewer.repositories.nodes || []).forEach(repo => {
                  totalStars += repo.stargazerCount || 0;
                  const edges = (repo.languages && repo.languages.edges) || [];
                  edges.forEach(edge => {
                    const name  = edge.node.name;
                    const color = edge.node.color || "#8b949e";
                    if (!langTotals[name]) langTotals[name] = { size: 0, color };
                    langTotals[name].size += edge.size;
                  });
                });

                const sortedLangs = Object.entries(langTotals)
                  .sort((a, b) => b[1].size - a[1].size)
                  .slice(0, 4);

                const totalLangSize = sortedLangs.reduce((s, [, v]) => s + v.size, 0) || 1;
                const langs = sortedLangs.map(([name, v]) => ({
                  name,
                  color: v.color,
                  pct: Math.round((v.size / totalLangSize) * 100)
                }));

                // --- REAL commit graph from contribution weeks ---
                const weeks = calendar.weeks || [];
                const weeklyTotals = weeks.map(w =>
                  (w.contributionDays || []).reduce((s, d) => s + (d.contributionCount || 0), 0)
                );
                const maxWeekly = Math.max(1, ...weeklyTotals);

                const graphX = 10, graphY = 8, graphW = 438, graphH = 50;
                const points = weeklyTotals.map((val, i) => {
                  const x = graphX + (weeklyTotals.length > 1
                    ? (i / (weeklyTotals.length - 1)) * graphW
                    : 0);
                  const y = graphY + graphH - (val / maxWeekly) * graphH;
                  return { x, y };
                });

                const linePath = points.length
                  ? points.map((p, i) =>
                      (i === 0 ? "M" : "L") + p.x.toFixed(1) + " " + p.y.toFixed(1)
                    ).join(" ")
                  : "M10 58 L448 58";
                const areaPath = points.length
                  ? linePath + " L" + points[points.length - 1].x.toFixed(1) + " 58 L" + points[0].x.toFixed(1) + " 58 Z"
                  : "M10 58 L448 58 Z";
                const lastPoint = points.length ? points[points.length - 1] : { x: 448, y: 58 };

                // --- REAL month labels from contribution dates ---
                const monthNames = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
                const labelIndices = [];
                if (weeks.length > 0) {
                  const step = Math.max(1, Math.floor((weeks.length - 1) / 5));
                  for (let i = 0; i <= weeks.length - 1; i += step) labelIndices.push(i);
                  if (labelIndices[labelIndices.length - 1] !== weeks.length - 1) {
                    labelIndices.push(weeks.length - 1);
                  }
                }
                const dateLabels = labelIndices.slice(0, 6).map(i => {
                  const day = weeks[i] && weeks[i].contributionDays && weeks[i].contributionDays[0];
                  const d = day ? new Date(day.date) : null;
                  const label = d ? monthNames[d.getUTCMonth()] : "";
                  const x = graphX + (weeks.length > 1
                    ? (i / (weeks.length - 1)) * graphW
                    : 0);
                  return { x: x.toFixed(0), label };
                });

                // --- REAL language bar segments ---
                const langBarWidth = 450;
                let langBarX = 0;
                const langBars = langs.map(l => {
                  const w = (l.pct / 100) * langBarWidth;
                  const bar = { x: langBarX, width: w, color: l.color };
                  langBarX += w;
                  return bar;
                });

                generateSvg({
                  totalCommits: totalCommits.toLocaleString(),
                  totalRepos:    totalRepos,
                  followers:     followers.toLocaleString(),
                  following:     following.toLocaleString(),
                  totalStars:    totalStars.toLocaleString(),
                  totalIssues:   totalIssues.toLocaleString()
                }, { linePath, areaPath, lastPoint, dateLabels, langs, langBars });

              } catch (e) {
                console.error("Parse error:", e, body);
                process.exit(1);
              }
            });
          });

          req.on("error", error => {
            console.error(error);
            process.exit(1);
          });

          req.write(data);
          req.end();

          function generateSvg(stats, chart) {
            const langLegend = chart.langs.map((l, i) => {
              const col = i % 4;
              const row = Math.floor(i / 4);
              const x = col * 110;
              const y = row * 20;
              return `<g transform="translate(${x} ${y})">
                <circle cx="4" cy="4" r="3.5" fill="${l.color}"/>
                <text x="12" y="8" class="language">${l.name} <tspan class="percentage">${l.pct}%</tspan></text>
              </g>`;
            }).join("");

            const langBarRects = chart.langBars.map(b =>
              `<rect x="${b.x.toFixed(1)}" y="0" width="${b.width.toFixed(1)}" height="10" fill="${b.color}"/>`
            ).join("");

            const dateLabelEls = chart.dateLabels.map(d =>
              `<text x="${d.x}" y="68" class="date">${d.label}</text>`
            ).join("");

            const svgContent = `<svg width="500" height="380" viewBox="0 0 500 380" xmlns="http://www.w3.org/2000/svg">
              <style>
                .header { font: 600 13px "Segoe UI", Ubuntu, sans-serif; fill: #f85149; }
                .section-title { font: 600 11px "Segoe UI", Ubuntu, sans-serif; fill: #e6edf3; }
                .stat-value { font: 600 16px "Segoe UI", Ubuntu, sans-serif; fill: #e6edf3; }
                .label { font: 400 10px "Segoe UI", Ubuntu, sans-serif; fill: #8b949e; }
                .language { font: 500 10px "Segoe UI", Ubuntu, sans-serif; fill: #e6edf3; }
                .percentage { font: 400 10px "Segoe UI", Ubuntu, sans-serif; fill: #8b949e; }
                .date { font: 400 9px "Segoe UI", Ubuntu, sans-serif; fill: #8b949e; }
              </style>
              <defs>
                <linearGradient id="graphGradient" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#ff6b6b" stop-opacity="0.45"/>
                  <stop offset="35%" stop-color="#f85149" stop-opacity="0.22"/>
                  <stop offset="70%" stop-color="#e63946" stop-opacity="0.08"/>
                  <stop offset="100%" stop-color="#c1121f" stop-opacity="0"/>
                </linearGradient>
                <clipPath id="languageBarClip">
                  <rect x="0" y="0" width="450" height="10" rx="5"/>
                </clipPath>
              </defs>
              <rect x="1.5" y="1.5" width="497" height="377" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
              <text x="25" y="30" class="header">GitHub Stats (Public &amp; Private)</text>
              <g transform="translate(25 44)">
                <rect x="0" y="0" width="215" height="40" rx="8" fill="#161b22" stroke="#30363d"/>
                <text x="12" y="16" class="label">Total Commits</text>
                <text x="12" y="32" class="stat-value">${stats.totalCommits}</text>
              </g>
              <g transform="translate(260 44)">
                <rect x="0" y="0" width="215" height="40" rx="8" fill="#161b22" stroke="#30363d"/>
                <text x="12" y="16" class="label">Total Repos (Public &amp; Private)</text>
                <text x="12" y="32" class="stat-value">${stats.totalRepos}</text>
              </g>
              <g transform="translate(25 90)">
                <rect x="0" y="0" width="215" height="40" rx="8" fill="#161b22" stroke="#30363d"/>
                <text x="12" y="16" class="label">Followers</text>
                <text x="12" y="32" class="stat-value">${stats.followers}</text>
              </g>
              <g transform="translate(260 90)">
                <rect x="0" y="0" width="215" height="40" rx="8" fill="#161b22" stroke="#30363d"/>
                <text x="12" y="16" class="label">Following</text>
                <text x="12" y="32" class="stat-value">${stats.following}</text>
              </g>
              <g transform="translate(25 136)">
                <rect x="0" y="0" width="215" height="40" rx="8" fill="#161b22" stroke="#30363d"/>
                <text x="12" y="16" class="label">Total Stars</text>
                <text x="12" y="32" class="stat-value">${stats.totalStars}</text>
              </g>
              <g transform="translate(260 136)">
                <rect x="0" y="0" width="215" height="40" rx="8" fill="#161b22" stroke="#30363d"/>
                <text x="12" y="16" class="label">Total Issues</text>
                <text x="12" y="32" class="stat-value">${stats.totalIssues}</text>
              </g>
              <text x="25" y="198" class="section-title">Commit Activity</text>
              <text x="140" y="198" class="label">Last 12 months</text>
              <g transform="translate(25 206)">
                <rect x="0" y="0" width="450" height="72" rx="7" fill="#161b22" stroke="#30363d"/>
                <line x1="10" y1="16" x2="440" y2="16" stroke="#21262d" stroke-width="1"/>
                <line x1="10" y1="32" x2="440" y2="32" stroke="#21262d" stroke-width="1"/>
                <line x1="10" y1="48" x2="440" y2="48" stroke="#21262d" stroke-width="1"/>
                <path d="${chart.areaPath}" fill="url(#graphGradient)"/>
                <path d="${chart.linePath}" fill="none" stroke="#f85149" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="${chart.lastPoint.x.toFixed(1)}" cy="${chart.lastPoint.y.toFixed(1)}" r="7" fill="#f85149" opacity="0.10"/>
                <circle cx="${chart.lastPoint.x.toFixed(1)}" cy="${chart.lastPoint.y.toFixed(1)}" r="3.5" fill="#f85149"/>
                ${dateLabelEls}
              </g>
              <text x="25" y="302" class="section-title">Most Used Languages</text>
              <g transform="translate(25 311)">
                <g clip-path="url(#languageBarClip)">
                  ${langBarRects}
                </g>
              </g>
              <g transform="translate(25 335)">
                ${langLegend}
              </g>
            </svg>`;

            if (!fs.existsSync("assets")) {
              fs.mkdirSync("assets", { recursive: true });
            }
            fs.writeFileSync("assets/activity.svg", svgContent);
            console.log("SVG generated successfully with real data.");
          }
          '

      - name: Commit and Push Changes
        run: |
          git config --global user.name "snakkeeh"
          git config --global user.email "snakke.gg@gmail.com"
          git add assets/activity.svg
          git diff --staged --quiet || (git commit -m "chore: update profile stats svg [skip ci]" && git push)
